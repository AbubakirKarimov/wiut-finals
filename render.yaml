# Render Blueprint for the ComplianceRadar API (see DEPLOY.md).
services:
  - type: web
    name: compliance-radar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: false   # deployed by .github/workflows/deploy.yml after CI passes
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_PATH
        value: data/compliance.sqlite
      - key: BROWSER_FALLBACK
        value: "0"
      - key: CRAWLER_MAX_PAGES_PER_BANK
        value: "15"
      - key: CRAWLER_MAX_DEPTH
        value: "2"
      - key: CRAWLER_TIME_BUDGET_SECONDS
        value: "60"
      - key: CRAWLER_MIN_DELAY_SECONDS
        value: "1.0"
      - key: CRAWLER_USER_AGENT
        value: "ComplianceRadar/0.1 (WIUT hackathon; consumer-protection research bot)"
      - key: CHECK_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: MAX_CONCURRENT_CHECKS
        value: "2"
      - key: CORS_ORIGINS
        sync: false     # https://<your-project>.vercel.app
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_PRICE_INPUT_PER_MTOK
        sync: false
      - key: LLM_PRICE_OUTPUT_PER_MTOK
        sync: false
