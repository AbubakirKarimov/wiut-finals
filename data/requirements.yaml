requirements:
- id: req:cbu_reg_3030:main:7
  text_original: '7. Банк ўзининг молиявий хизматлари тўғрисидаги маълумотларни истеъмолчиларга давлат
    тилида етказиши лозим. Банкнинг молиявий хизматлари тўғрисидаги маълумотлар қўшимча равишда бошқа
    тилларда ҳам тақдим этилиши мумкин.

    Банк хизматлари тўғрисидаги маълумотларнинг матни лўнда, оддий ва равон тилда баён этилиши керак.'
  text_en: The bank must provide information about its financial services to consumers in Uzbek, using
    clear and plain language.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:7
  source_url: https://lex.uz/ru/docs/3804290#5289561
  check_type: uz_version
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:14
  text_original: 14. Банкнинг расмий веб-сайтида сайтнинг тузилишини баён этувчи, ушбу тузилмадаги расмий
    веб-сайтнинг ҳар бир саҳифаси жойлашган жойни қулай шаклда аниқлаш имконини берувчи бўлим бўлиши керак.
  text_en: The bank must provide a section on its official website that describes the site structure and
    allows easy identification of the location of each page.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:14
  source_url: https://lex.uz/ru/docs/3804290#3804959
  check_type: required_document
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:17
  text_original: 17. Банк расмий веб-сайтининг мазкур банк ва кўрсатилаётган банк хизматлари шартлари
    тўғрисида ахборотларни ўз ичига олган бўлимига веб-сайтнинг бош саҳифасидан гиперҳаволалар орқали
    бир ўтишда кириш учун имкони яратилган бўлиши керак.
  text_en: The bank must provide a link on its homepage that leads to a section containing information
    about the bank and the terms of the services offered.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:17
  source_url: https://lex.uz/ru/docs/3804290#3804968
  check_type: required_document
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:18^1
  text_original: 18^1. Банклар ўзларининг расмий веб-сайтларида, шунингдек мобил иловаларида (агар мавжуд
    бўлса) жисмоний шахсларга мўлжалланган кредитларнинг тўлиқ қийматини мустақил ҳисоблаб чиқиш имкониятини
    яратиб беришлари лозим.
  text_en: Banks must provide on their public website a tool that allows natural persons to independently
    calculate the full cost of loans intended for individuals.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:18^1
  source_url: https://lex.uz/ru/docs/3804290#7643197
  check_type: key_info
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:28^1
  text_original: '28^1. Банклар молиявий қийинчиликлар, мураккаб ҳаётий вазиятларга тушиб қолган ҳамда
    форс-мажор ҳолатлари туфайли ўз вақтида кредит тўловларини амалга оширишга қийналаётган истеъмолчиларнинг
    амалдаги кредитлари бўйича кредит шартномаси шартларига ўзгартириш ва қўшимчалар киритиш (реструктуризация)
    имкониятлари борасидаги аризаларини кўриб чиқиш тартибига эга бўлиши ва ушбу тартибни банкнинг расмий
    веб-сайтида жойлаштириши шарт.

    Мазкур тартиб камида қуйидагиларни ўз ичига қамраб олиши лозим:

    кредит шартномаси шартларига ўзгартириш ва қўшимчалар киритишнинг (реструктуризация) турлари (масалан,
    кредит тўловлари муддатини узайтириш, кредит фоиз ставкасини қайта кўриб чиқиш, кредит тўловларини
    кечиктирганлик учун жарима ва пенялар миқдорини камайтириш ва бошқалар);

    кредит шартномаси шартларига ўзгартириш ва қўшимчалар киритишга (реструктуризацияга) асос бўладиган
    молиявий қийинчиликлар, мураккаб ҳаётий вазиятлар ҳамда форс-мажор ҳолатлар рўйхати;

    истеъмолчининг аризаларини қабул қилиш, рўйхатга олиш тартиби ҳамда аризага илова қилинадиган зарур
    ҳужжатларнинг рўйхати;

    истеъмолчининг аризаларини кўриб чиқиш муддатлари;

    қабул қилинган аризаларни кўриб чиқиш ва баҳолаш мезонлари;

    ариза бўйича банк томонидан қабул қилинган қарор ҳақида истеъмолчига хабар бериш тартиби ва муддати;

    ариза қаноатлантирилган тақдирда, кредит шартномаси ҳамда унинг иловаларига қўшимча ва ўзгартиришлар
    киритиш тартиби;

    аризани қанотлантиришни рад этиш бўйича қарор қабул қилинганда, бу тўғрисида асослантирилган ҳолда
    аризачига хабар бериш тартиби.

    Бунда ушбу тартибда ҳомиладорлик ва туғиш таътилини олган аёлларнинг амалдаги кредитлари бўйича тўловлар
    муддатини ўн ойгача узайтириш тўғрисидаги аризаларини кўриб чиқиш бўйича қоидалар мажбурий тарзда
    акс эттирилиши лозим.'
  text_en: The bank must publish on its official website the procedure for reviewing consumer applications
    to modify or add to loan contract terms (restructuring), including all items listed in the clause.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:28^1
  source_url: https://lex.uz/ru/docs/3804290#7816721
  check_type: required_document
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:37^5
  text_original: '37^5. Банклар ажратилган кредит таъминотига қабул қилинган гаров мулкларини кредитнинг
    асосий қарзи қолдиғига мутаносиб равишда босқичма-босқич гаровдан чиқариш ёки гаров нарсасини алмаштириш
    бўйича қуйидагиларни ўз ичига олувчи алоҳида тартибга эга бўлиши ва ушбу тартиб банкнинг расмий веб-сайтида
    жойлаштирилиши лозим:

    қарз олувчи ёки гаровга қўювчининг гаровга қўйилган мол-мулкларни босқичма-босқич гаровдан чиқариш
    ёки гаров нарсасини алмаштириш бўйича аризасини рўйхатга олиш ҳамда ушбу аризани кўриб чиқиш муддати;

    гаровга қўйилган мол-мулкларни босқичма-босқич гаровдан чиқариш ёки гаров нарсасини алмаштириш масаласини
    кўриб чиқиш ва тегишли қарорни қабул қилиш бўйича банкнинг ваколатли органи тўғрисида ҳамда мазкур
    ваколатли органнинг қарори ҳақида аризачига хабар бериш муддати;

    гаровга қўйилган мол-мулкларни босқичма-босқич гаровдан чиқариш ёки гаров нарсасини алмаштиришни рад
    этиш бўйича қарор қабул қилинганда, бу тўғрисида асослантирилган ҳолда аризачига хабар бериш.

    Банк кредит бўйича тузиладиган гаров шартномасида банкнинг гаров таъминотига қўйилган талаблардан
    келиб чиққан ҳолда қарз олувчининг кредитнинг қопланмаган қисмидан ортиқ суммада гаров таъминоти суммасини
    камайтириш ҳуқуқини, шунингдек гаров таъминотини камайтириш тартиби ва усулларини акс эттириши шарт.

    Кредит қарздорлигини қоплаш мақсадида банк гаровга қўйилган мол-мулкни суддан ташқари тартибда қонунчиликда
    тақиқланмаган усуллар орқали гаровга қўювчи билан қонунчиликда белгиланган тартибда келишган ҳолда
    реализация қилиши мумкин.

    Бунда, банк мол-мулкни реализация қилишдан тушган маблағларни кредит қарздорлиги ва бошқа харажатларга
    йўналтирилиши юзасидан қарз олувчи ва гаровга қўювчига ёзма маълумот юборилишини таъминлаши лозим.'
  text_en: The bank must publish on its official website a separate procedure describing the step‑by‑step
    release or substitution of pledged assets for secured loans.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:37^5
  source_url: https://lex.uz/ru/docs/3804290#7643494
  check_type: required_document
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:40^4
  text_original: 40^4. Банкнинг расмий веб-сайтида омонатлар тўғрисидаги ахборот жойлаштирилган саҳифада
    «Омонатларингиз кафолатланган» деган мазмунда кўзга ташланадиган тегишли ҳавола (гиперҳавола) жойлаштириши
    ва ушбу тегишли ҳавола (гиперҳавола) Омонатларни кафолатлаш агентлигининг расмий веб-сайтидаги тегишли
    саҳифага йўналтирилиши керак.
  text_en: The bank must place a visible hyperlink with the text “Your deposits are guaranteed” on its
    deposit information page that links to the corresponding page on the Deposit Guarantee Agency’s official
    website.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:40^4
  source_url: https://lex.uz/ru/docs/3804290#7816849
  check_type: key_info
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:49
  text_original: '49. Банк истеъмолчиларнинг мурожаатларини кўриб чиқиши ва кўриб чиқиш натижалари бўйича
    мурожаат этувчиларга жавоб бериши лозим.

    Банк оғзаки, ёзма ёхуд электрон шаклдаги мурожаатларни қабул қилиш учун шароитлар яратиши зарур.

    Банк истеъмолчиларга хизмат кўрсатиш офисларида (ёки марказларида), филиалларида ва ўзининг расмий
    веб-сайти орқали мурожаатларни қабул қилишни йўлга қўяди. Банк расмий веб-сайтининг бош саҳифасида
    ёки сайтнинг ўзгармас юқори қисмида (ушбу саҳифада) яққол кўринарли тарзда жойлаштирилган ҳавола орқали
    тўғридан-тўғри ўтиш мумкин бўлган бошқа саҳифасида мурожаатларни қабул қилишни ташкил этади.

    Банк мобил иловасида истеъмолчилар томонидан мурожаат қолдирилиши учун имконият яратади ва/ёки мурожаат
    юборилиши учун алоқа каналларини кўрсатиши керак.

    Банк истеъмолчилар билан телефон алоқаси орқали боғланишини таъминловчи Call-марказларни ташкил этиб,
    у орқали истеъмолчиларга банк фаолияти билан боғлиқ маслаҳатлар ва тушунтиришлар беради ҳамда оғзаки
    шаклдаги мурожаатларни қабул қилади.'
  text_en: The bank must provide a clearly visible link on its homepage or top navigation that leads directly
    to a page where consumer complaints can be submitted.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:49
  source_url: https://lex.uz/ru/docs/3804290#7170589
  check_type: key_info
  approved: true
  text_en_label: machine translation
- id: req:cbu_reg_3030:main:51
  text_original: 51. Call-марказ телефонларининг рақамлари банк расмий веб-сайтининг бош саҳифасида, шунингдек,
    банк ва унинг филиалларидаги ахборот стендларида ҳамда банк (филиал) биносидан ташқарида ташкил этилган
    банк хизматлари марказлари ва кассаларнинг истеъмолчига кўринарли жойда ўқишга имконияти бўлган ҳолда
    жойлаштирилиши керак.
  text_en: The bank must display the call‑center telephone numbers on the homepage of its official website
    in a location visible to consumers.
  source_doc: cbu_reg_3030
  source_clause_id: cbu_reg_3030:main:51
  source_url: https://lex.uz/ru/docs/3804290#7170595
  check_type: key_info
  approved: true
  text_en_label: machine translation
