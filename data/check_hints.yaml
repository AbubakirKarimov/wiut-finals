# Human-reviewable check configuration per approved requirement. The single source of
# keywords, sections, homepage rules and deterministic rules: no requirement-specific list
# lives in code. Read by backend/checks/llm_checks.py and backend/checks/rules.py.
#
# Matching (everywhere): word stems (first 5 letters), Latin/Cyrillic and apostrophe variants
#   unified, words of a keyword in any order within a short window (backend/checks/evidence.py).
#
# rule: a deterministic check, no LLM (backend/checks/rules.py). decided_by = "code".
#   kind: link   -> a link whose anchor text or URL path matches link_keywords, or whose host
#                   is in link_domains, on the pages named by `where`
#                   (homepage | section | any). Found only on other pages -> not_checkable.
#   kind: phone  -> a +998 number, or a short 1xxx number near a phone_context word, in the
#                   homepage text (a bank's public call-centre number, required by 3030 §51).
#   ok_note: appended to an ok explanation (what the code did NOT verify).
# keywords: for requirements WITHOUT a rule (they need reading: LLM-assisted). Keyword
#   candidates go to the LLM, which may confirm (ok, quote verified by code) but can never
#   create a possible_gap; a gap needs code-level absence (no candidate in the read section).
# sections: where the evidence is expected (backend/crawl/sections.py names, plus
#   "homepage"). A possible_gap needs at least one page of these sections read; otherwise
#   not_checkable "relevant section not reached" (audit B7).
# title: short English name shown in the UI (not a legal text).
# location: homepage -> LLM path sends the home page first; evidence only on an inner page is
#   not_checkable (audit B2). Deterministic rules express the same with where: homepage.
requirements:
  req:cbu_reg_3030:main:7:      # Uzbek (state language) version of the website
    title: "Uzbek-language version"

  req:cbu_reg_3030:main:14:     # section describing the site structure (site map)
    title: "Site map / site structure section"
    sections: [homepage]
    rule:
      kind: link
      where: homepage
      link_keywords: ["sayt xaritasi", "sayt kartasi", "sayt tuzilmasi", "сайт харитаси",
                      "карта сайта", "структура сайта", sitemap, "site map"]

  req:cbu_reg_3030:main:17:     # homepage link to information about the bank and its services
    title: "Homepage link to bank information"
    sections: [homepage]
    rule:
      kind: link
      where: homepage
      link_keywords: ["bank haqida", "biz haqimizda", "банк ҳақида", "о банке",
                      about, "about us", "about bank"]
      ok_note: "Whether the linked section also covers the terms of the bank's services is not verified."

  req:cbu_reg_3030:main:18^1:   # loan full-cost calculator for natural persons
    title: "Loan full-cost calculator"
    sections: [loan]
    rule:
      kind: link
      where: any
      link_keywords: [kalkulyator, калькулятор, calculator, calc]
      ok_note: "Presence only: whether the calculator shows the full cost of the loan (all interest and fees) is not verified."

  req:cbu_reg_3030:main:28^1:   # procedure for applications to change loan terms (LLM-assisted)
    title: "Procedure to change loan terms"
    sections: [loan, document, restructuring]
    keywords:
      uz_latn: [restrukturizatsiya, "kredit shartlarini o'zgartirish", "shartnoma shartlarini o'zgartirish",
                "to'lov muddatini uzaytirish", "to'lov jadvalini o'zgartirish", "kredit ta'tili"]
      uz_cyrl: [реструктуризация, "кредит шартларини ўзгартириш", "тўлов муддатини узайтириш",
                "тўлов жадвалини ўзгартириш", "кредит таътили"]
      ru: [реструктуризация, "изменение условий кредита", "изменения условий кредитного договора",
           "кредитные каникулы", "изменение графика платежей"]
      en: [restructuring, "change of loan terms", "loan term change"]

  req:cbu_reg_3030:main:37^5:   # procedure for releasing or replacing collateral (LLM-assisted)
    title: "Collateral release procedure"
    sections: [loan, document]
    keywords:
      uz_latn: ["garovdan ozod qilish", "garovni almashtirish", "garov mulkini qaytarish",
                "taqiqni olib tashlash", "taqiqdan chiqarish"]
      uz_cyrl: ["гаровдан озод қилиш", "гаровни алмаштириш", "гаров мулкини қайтариш",
                "тақиқни олиб ташлаш", "тақиқдан чиқариш"]
      ru: ["освобождение от залога", "замена залога", "снятие залога", "снятие обременения",
           "возврат залога"]
      en: ["collateral release", "release of collateral", "pledge release", "collateral substitution"]

  req:cbu_reg_3030:main:40^4:   # "Your deposits are guaranteed" link on the deposit page
    title: '"Your deposits are guaranteed" link'
    sections: [deposit]
    rule:
      kind: link
      where: section
      link_keywords: ["omonatlaringiz kafolatlangan", "omonat kafolat", "omonatlarni kafolatlash",
                      "омонатларингиз кафолатланган", "омонат кафолат", "вклады гарантированы",
                      "гарантирования вкладов", "гарантия вкладов", "deposits guaranteed",
                      "deposit guarantee"]
      # Deposit Guarantee Agency domain, as linked from stored bank pages (agrobank.uz deposit
      # pages: "Omonatlaringiz kafolatlangan" -> fgd.uz; garantbank.uz: "Агентство по
      # гарантированию вкладов" -> fgd.uz). Verify against the CBU website.
      link_domains: [fgd.uz]

  req:cbu_reg_3030:main:49:     # complaint page linked from the homepage or top navigation
    title: "Complaints link on the homepage"
    sections: [homepage, complaint]
    location: homepage
    rule:
      kind: link
      where: homepage
      link_keywords: [murojaat, shikoyat, мурожаат, шикоят, обращени, жалоб, "виртуальная приемная",
                      "virtualnaya priemnaya", feedback, complaint, appeal]

  req:cbu_reg_3030:main:51:     # call-centre numbers on the homepage
    title: "Call-centre numbers on the homepage"
    sections: [homepage]
    location: homepage
    rule:
      kind: phone
      where: homepage
      phone_context: [call, "call-markaz", "call-центр", "колл-центр", telefon, телефон, aloqa,
                      алоқа, markaz, ishonch, справ, contact, контакт, "qo'ng'iroq", звонок]
