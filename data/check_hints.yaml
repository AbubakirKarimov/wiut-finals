# Human-reviewable search hints per approved requirement (read by backend/checks/llm_checks.py).
#
# keywords: when present, used INSTEAD of the keywords the LLM proposes. Matching is by word
#   stems (first 5 letters), Latin/Cyrillic and apostrophe variants unified, words of a keyword
#   in any order within a short window (backend/checks/evidence.py).
#   The two entries below are the LLM's cached keyword lists with spelling errors fixed
#   (audit bug B1): "gipergavola" -> "giperhavola", "кфолатланган" -> "кафолатланган",
#   "шикайот" -> "шикоят", "алока" -> "алоқа". For 40^4 the link text quoted in the
#   regulation itself ("Омонатларингиз кафолатланган") was added. Review before relying on it.
#
# sections: where the evidence is expected (names from backend/crawl/sections.py, plus
#   "homepage" = site root or a language root). A possible_gap is reported only if at least
#   one page of these sections was read; otherwise not_checkable "relevant section not
#   reached" (audit bug B7, approved). No entry = no section requirement.
# location: homepage = the requirement names the homepage; the homepage is always sent to
#   the LLM first and evidence found only on an inner page is not reported as ok (audit B2).
requirements:
  req:cbu_reg_3030:main:14:     # section describing the site structure (site map)
    sections: [homepage]
  req:cbu_reg_3030:main:17:     # homepage link to information about the bank and its services
    sections: [homepage]
  req:cbu_reg_3030:main:18^1:   # loan full-cost calculator for natural persons
    sections: [loan]
  req:cbu_reg_3030:main:28^1:   # procedure for applications to change loan terms
    sections: [loan, document, restructuring]
  req:cbu_reg_3030:main:37^5:   # procedure for releasing or replacing collateral
    sections: [loan, document]
  req:cbu_reg_3030:main:40^4:   # "Your deposits are guaranteed" link on the deposit page
    sections: [deposit]
    keywords:
      uz_latn: ["omonatlaringiz kafolatlangan", "omonat kafolat", "kafolatlangan omonat",
                "deposit kafolati", "guaranteed omonat", "omonatlar kafolati", "giperhavola"]
      uz_cyrl: ["омонатларингиз кафолатланган", "омонат кафолат", "кафолатланган омонат",
                "депозит кафолати", "гарантия омонат", "омонатлар кафолати", "гиперҳавола"]
      ru: ["ваши вклады гарантированы", "гарантия вкладов", "депозит гарантирован",
           "гарантированный вклад", "ссылка гарантии", "страница гарантии", "депозитная гарантия"]
      en: ["deposit guarantee", "guaranteed deposits", "deposit guarantee link",
           "guarantee hyperlink", "deposit protection", "guarantee page"]
  req:cbu_reg_3030:main:49:     # complaint page linked from the homepage or top navigation
    sections: [homepage, complaint]
    location: homepage
    keywords:
      uz_latn: [shikoyat, murojaat, aloqa, telefon, onlayn, form]
      uz_cyrl: [шикоят, мурожаат, алоқа, телефон, онлайн, форм]
      ru: [жалоба, обращение, контакт, телефон, онлайн, форма]
      en: [complaint, feedback, contact, support, online, form]
  req:cbu_reg_3030:main:51:     # call-centre numbers on the homepage
    sections: [homepage]
    location: homepage
