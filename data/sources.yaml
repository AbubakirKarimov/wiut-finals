# Registry of source legal documents (lex.uz).
# status:   verified only after the title and number on the saved lex.uz page match the
#           expectation (checked against the page, not inferred from the id).
# role:     regulation - CBU regulation we split into clauses and check against
#           law        - law we split into articles and check against
#           amendment  - amends a regulation/law; kept for reference (amendments are already
#                        consolidated into the canonical text on lex.uz)
#           reference  - related act, not a check source
# language: canonical text language (uz_cyrl | uz_latn | ru). The official text is canonical.
# parallel: other language versions of the same act; block ids map one-to-one when noted.
# Do not guess doc IDs: leave lex_uz_doc_id / url empty until confirmed.

sources:
