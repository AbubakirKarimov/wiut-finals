# Registry of source legal documents (lex.uz).
# status: verified only after the title and number on the lex.uz page match the expectation
#         (checked against the saved page, not inferred from the id).
# role:   primary   - text we split into clauses and check against
#         amendment - amends a primary document; kept for reference
#         reference - related act, not a check source
# has_text_on_page: whether the fetched (Russian) page contains the act's body text.
# Do not guess doc IDs: leave lex_uz_doc_id / url empty until confirmed.

