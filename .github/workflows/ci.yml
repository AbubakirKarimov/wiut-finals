name: CI

# Runs on a clean machine: no .env, no secrets, no real LLM calls, no real bank sites.
# Backend tests use fakes (scripted LLM provider, httpx MockTransport, fixture pages).
# The Playwright e2e suite runs locally: cd frontend && npx playwright test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CHECK_RATE_LIMIT_PER_MINUTE: "5"
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
