name: Deploy

# Runs after CI succeeds on main. Each step is skipped until its secrets exist,
# so the workflow is safe before the services are set up (see DEPLOY.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  backend-render:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
      - name: Render not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping backend deploy."

  frontend-vercel:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: "20"
      - name: Deploy frontend to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Vercel not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret is not set; skipping frontend deploy."
